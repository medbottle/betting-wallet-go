# Scrapes the metrics listener (METRICS_ADDR :9090) of each app instance on
# the compose network. app-2 and app-3 exist only with
# docker-compose.multi.yml; without it they show as down.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: wallet
    static_configs:
      - targets: ["app:9090", "app-2:9090", "app-3:9090"]
